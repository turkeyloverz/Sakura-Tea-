name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  JELLYFIN_VERSION: "12.0.0"
  TARGET_ABI: "12.0.0.0"
  CSPROJ: "src/Jellyfin.Plugin.SakuraTea/Jellyfin.Plugin.SakuraTea.csproj"

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Parse release version
        id: version
        shell: bash
        run: |
          MSG=$(jq -r '.head_commit.message' "$GITHUB_EVENT_PATH" | head -n1)
          if [[ "$MSG" =~ \(v([0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?)\) ]]; then
            TAG="${BASH_REMATCH[1]}"
            VERSION="$TAG"
            if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then VERSION="$VERSION.0"; fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: parse
    if: needs.parse.outputs.release == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate frontend JavaScript
        shell: bash
        run: |
          find src/Jellyfin.Plugin.SakuraTea/Inject -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("src/Jellyfin.Plugin.SakuraTea/Configuration/config.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html, flags=re.I)
          if not scripts:
              raise SystemExit("No inline configuration script found")
          Path("/tmp/sakura-config.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/sakura-config.js
          node --test tests/*.test.cjs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: |
          dotnet build "$CSPROJ" \
            --configuration Release \
            -p:JellyfinVersion=$JELLYFIN_VERSION \
            -p:Version=${{ needs.parse.outputs.version }}

      - name: Package plugin
        id: package
        shell: bash
        run: |
          VERSION="${{ needs.parse.outputs.version }}"
          OUT_DIR="$GITHUB_WORKSPACE/src/Jellyfin.Plugin.SakuraTea/bin/Release/net10.0"
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          ZIP_NAME="Jellyfin.Plugin.SakuraTea_12.0.0.zip"
          ZIP_PATH="$DIST_DIR/$ZIP_NAME"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S.0000000Z")

          mkdir -p "$DIST_DIR"

          jq -n \
            --arg version "$VERSION" \
            --arg timestamp "$TIMESTAMP" \
            --arg targetAbi "$TARGET_ABI" \
            '{
              category: "General",
              changelog: "Personal pupil slider, per-user dark mode without hero or wallpaper, and full-width sakura divider.",
              description: "A Sakura-inspired cinematic Jellyfin Web experience.",
              guid: "3bf6515b-c10a-4307-a3e8-942eaffe900d",
              name: "Sakura Tea",
              overview: "Anime-first hero, Sakura visuals, petals and a refined Jellyfin home experience.",
              owner: "turkeyloverz",
              targetAbi: $targetAbi,
              timestamp: $timestamp,
              version: $version,
              status: "Active",
              autoUpdate: true,
              assemblies: ["Jellyfin.Plugin.SakuraTea.dll"]
            }' > "$OUT_DIR/meta.json"

          (
            cd "$OUT_DIR"
            zip -j "$ZIP_PATH" Jellyfin.Plugin.SakuraTea.dll meta.json
          )

          CHECKSUM=$(md5sum "$ZIP_PATH" | awk '{print toupper($1)}')
          SOURCE_URL="https://github.com/turkeyloverz/Sakura-Tea-/releases/download/${{ needs.parse.outputs.tag }}/$ZIP_NAME"

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "source_url=$SOURCE_URL" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Update manifest
        shell: bash
        run: |
          VERSION="${{ needs.parse.outputs.version }}"
          jq \
            --arg version "$VERSION" \
            --arg sourceUrl "${{ steps.package.outputs.source_url }}" \
            --arg checksum "${{ steps.package.outputs.checksum }}" \
            --arg timestamp "${{ steps.package.outputs.timestamp }}" \
            --arg targetAbi "$TARGET_ABI" \
            '.[0].versions = (
              [{
                version: $version,
                changelog: "Personal pupil slider, per-user dark mode without hero or wallpaper, and full-width sakura divider.",
                targetAbi: $targetAbi,
                sourceUrl: $sourceUrl,
                checksum: $checksum,
                timestamp: $timestamp,
                dependencies: []
              }] + (.[0].versions | map(select(.version != $version)))
            )' manifest.json > manifest.json.tmp
          mv manifest.json.tmp manifest.json

      - name: Commit manifest
        shell: bash
        run: |
          VERSION="${{ needs.parse.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: publish manifest for $VERSION"
            git push origin HEAD:main
          fi

      - name: Tag release
        shell: bash
        run: |
          VERSION="${{ needs.parse.outputs.version }}"
          TAG="${{ needs.parse.outputs.tag }}"
          git tag -a "$TAG" -m "Sakura Tea $TAG"
          git push origin "$TAG"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.parse.outputs.tag }}
          name: Sakura Tea ${{ needs.parse.outputs.tag }}
          prerelease: true
          body: |
            Sakura Tea ${{ needs.parse.outputs.tag }} for Jellyfin 12.

            - Compact pupil slider remembers each user’s appearance in this browser.
            - Dark mode removes the hero, wallpaper, petals, glow, and blur.
            - Full-width divider with more petals and two slowly spinning sakura flowers.
            - Unified header and improved UI builder.

            Requires File Transformation for frontend injection.
          files: dist/${{ steps.package.outputs.zip_name }}
          fail_on_unmatched_files: true
